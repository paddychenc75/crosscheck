# 规则仓库的 MR 检查:编号、负责人、头部字段、正反例是否齐全、评测用例格式。
# CROSSCHECK_REPO 指向 crosscheck 插件的仓库(内网镜像或 GitHub)。
rules-lint:
  image: python:3.11-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - git clone --depth 1 "${CROSSCHECK_REPO:-https://github.com/paddychenc75/crosscheck.git}" /tmp/crosscheck
  script:
    - sh /tmp/crosscheck/skills/cr/scripts/rules-lint.sh --rules-repo .
