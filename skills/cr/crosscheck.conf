# crosscheck 的插件级配置:随插件一起分发,团队在自己的插件市场里改这一份,所有成员装上就生效。
# 每个人的 ~/.crosscheck/config 里写了同名的设置时,以个人的为准(按设置逐项覆盖)。
# 每行一个 key=value,# 开头是注释。可用的设置见 templates/config.example。
#
# 需求来源:按用途分类,每类写读取它用的 skill 或命令名(多个用逗号分隔),怎么调用由 agent 决定。
# source.ticket = <读取需求单的 skill 或命令名>
# source.prd = <读取需求文档的 skill 或命令名>
# source.required = ticket, prd
# source.ticket.label = <MR 说明里需求单显示的名字>
# source.prd.label = PRD
# source.ticket.match = <需求单链接里的关键字>
#
# MR 说明的网页版:生成和更新网页用的 skill 或命令名;不写就只生成本地文件。
# output.page = <发布网页的 skill 或命令名>
