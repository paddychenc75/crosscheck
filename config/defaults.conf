# crosscheck 的配置模板:所有设置都在这里,默认全部注释掉;要用哪项,去掉那行开头的 # 再填值。
# 团队统一的设置:在自己的插件市场里改这一份,所有成员装上就生效。
# 个人覆盖:写到 ~/.crosscheck/config(格式相同,可以把这份复制过去),同名设置以个人的为准。值留空等于没配置。

# ---------- 平台 ----------
# 私有化 GitLab 的域名;域名里不含 gitlab 时才需要,多个用逗号分隔,部署在子路径下时写全。不写就只认域名里带 gitlab 的。
# 只用来识别平台和子路径,不是访问白名单:读取哪个仓库只由当前仓库的 origin 决定。
#   例:gitlab_hosts = code.company.com,company.com/gitlab
# gitlab_hosts =

# ---------- 模型 ----------
# 查找问题用的模型,写当前宿主认识的模型名。强模型能找到更多高危问题,想省钱可以换便宜的。不写就用宿主当前的模型。
#   例(Claude Code):opus
# model.finder =
# 核实问题用的模型,最好和查找用的不同,不同家的模型盲区不同。不写就用宿主当前的模型。
#   例(Claude Code):opus
# model.verifier =

# ---------- 外部工具 ----------
# 下面三项的值都是写给 agent 的一句话:用哪个 skill 或命令、怎么用。一行写完,别出现「空格加 #」(会被当成注释)。
# 代码托管工具,用来读 MR / PR 的标题、描述、讨论、目标分支和源引用;只能是只读的工具,不能评论、改描述或合入。
# 写了以后,给链接形式的 MR / PR(GitHub、GitLab 的链接也一样)都改由它读取,不再用 gh / glab;脚本会自己核对仓库、
# 分支和提交,核对不过就只用 git 拉代码,并写明 MR 信息没有读到。不写就照旧用 gh / glab。
#   例:用 acme-kit:mr-reader 读 MR,链接形如 https://code.example.com/x/y/merge/12
# tools.code_host =
# 需求管理工具,用来读需求单(标题、描述、验收标准)。不写就只认 GitLab / GitHub 的 Issue,别的需求单要你自己补一句目的。
# 想让它自动识别需求单链接,就在这句话里写一个链接示例,它会按其中的域名识别。
#   例:用 acme-kit:ticket-reader 读需求单,链接形如 https://tickets.example.com/browse/XX-123
# tools.requirement =
# 文档阅读工具,用来读 PRD、技术方案等文档链接。不写就不读文档内容,只记下链接。
# 同样按这句话里的链接示例的域名识别文档链接。
#   例:用 acme-kit:doc-reader 读文档链接,支持 https://docs.example.com/ 下的页面
# tools.doc_reader =

# ---------- 需求收集 ----------
# 审查前必须问到的需求类别(用户可以跳过):ticket 是需求单,doc 是需求文档,多个用逗号分隔。不写就只有 ticket。
# 缺了就问一次,同一个分支 90 天内不再问;不在这里的类别不算缺,但每个分支也会顺便问一次(可跳过),所以 PRD 之类的资料不用写在这里也能补上。
# 只能写 ticket 和 doc;写了别的名字不会报错,但没有对应的工具和识别规则。
#   例:intent.required = ticket, doc
# intent.required =
